# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Validate built site and article inventory
        run: |
          python3 -B scripts/validate_blog.py \
            --public public \
            --python-snippets \
            --structured-snippets \
            --strict-math
          node scripts/test_blog_filter.cjs public
          node scripts/test_site_search.cjs
          node scripts/test_multiview_geometry_lab.cjs
          node scripts/test_supermimic_gradient_lab.cjs
          node scripts/test_llm_budget.cjs
          node scripts/test_rrsi_selection_lab.cjs
          node scripts/test_v2d_height_lab.cjs
          python3 -B content/posts/ai/morphmimic/morphmimic_contracts.py --check
          python3 -B scripts/test_morphmimic_contracts.py
          python3 -B scripts/test_blog_toc.py
          python3 -B scripts/test_blog_images.py
          python3 -B scripts/test_blog_fallback.py
          python3 -B scripts/test_pid_examples.py
          python3 -B scripts/test_site_assets.py --public public
      - name: Test portable C++ and loopback examples
        run: |
          python3 -B scripts/test_blog_examples.py --only cpp cmake modbus network
      - name: Set up Python for executable progress examples
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Test published progress examples
        run: |
          progress_env="${RUNNER_TEMP}/progress-example-tests"
          python -m venv "$progress_env"
          "$progress_env/bin/python" -m pip install --disable-pip-version-check \
            --only-binary=:all: --require-hashes -r scripts/requirements-progress.txt
          "$progress_env/bin/python" -B scripts/test_tqdm_examples.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
