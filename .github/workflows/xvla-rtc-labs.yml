name: Check X-VLA and RTC article downloads

on:
  push:
    branches: ["main"]
    paths:
      - "content/posts/ai/x-vla/**"
      - "content/posts/ai/real-time-chunking/**"
      - "scripts/package_xvla_rtc_labs.py"
      - ".github/workflows/xvla-rtc-labs.yml"
  pull_request:
    paths:
      - "content/posts/ai/x-vla/**"
      - "content/posts/ai/real-time-chunking/**"
      - "scripts/package_xvla_rtc_labs.py"
      - ".github/workflows/xvla-rtc-labs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            content/posts/ai/x-vla/requirements.txt
            content/posts/ai/real-time-chunking/requirements.txt
      - name: Check downloads match source
        run: python scripts/package_xvla_rtc_labs.py --check
      - name: Install CPU dependencies
        run: |
          python -m pip install \
            -r content/posts/ai/x-vla/requirements.txt \
            -r content/posts/ai/real-time-chunking/requirements.txt
      - name: Run extracted teaching programs
        run: python scripts/package_xvla_rtc_labs.py --check --test
