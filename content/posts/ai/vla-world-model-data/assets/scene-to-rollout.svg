<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">空间资产到训练轨迹</title><desc id="desc">视觉重建以后还要定义物理、控制和任务，再执行并对照真机验证。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#245b9e"/></marker></defs><rect width="1100" height="720" rx="22" fill="#fffef9"/><g font-family="system-ui, Noto Sans CJK SC, sans-serif" fill="#17243c"><text x="35" y="48" font-size="30" font-weight="700">看起来像真实场景，还需要哪些步骤？</text><rect x="35" y="90" width="480" height="135" rx="16" fill="#edf5ff" stroke="#8daed2"/><text x="55" y="126" font-size="24" font-weight="700">1  视觉与空间输入</text><text x="55" y="163" font-size="21" font-weight="400">照片 / 视频 / 多视角 / 相机轨迹</text><text x="55" y="194" font-size="21" font-weight="400">重建或生成几何与外观</text><rect x="585" y="90" width="480" height="135" rx="16" fill="#eee8f8" stroke="#8daed2"/><text x="605" y="126" font-size="24" font-weight="700">2  可交互环境</text><text x="605" y="163" font-size="21" font-weight="400">碰撞、质量、摩擦、关节与接触</text><text x="605" y="194" font-size="21" font-weight="400">区分视觉背景和可交互对象</text><path d="M522,155 L575,155" fill="none" stroke="#245b9e" stroke-width="3" marker-end="url(#arrow)"/><path d="M825,232 L825,282" fill="none" stroke="#245b9e" stroke-width="3" marker-end="url(#arrow)"/><rect x="585" y="295" width="480" height="140" rx="16" fill="#eee8f8" stroke="#8daed2"/><text x="605" y="331" font-size="24" font-weight="700">3  执行接口与任务定义</text><text x="605" y="368" font-size="21" font-weight="400">控制频率、执行器、传感器与延迟</text><text x="605" y="399" font-size="21" font-weight="400">初始状态、成功条件、失败与重置</text><path d="M575,365 L525,365" fill="none" stroke="#245b9e" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="295" width="480" height="140" rx="16" fill="#edf5ff" stroke="#8daed2"/><text x="55" y="331" font-size="24" font-weight="700">4  在环境中实际执行</text><text x="55" y="368" font-size="21" font-weight="400">人工示范 / 规划器 / 策略 rollout</text><text x="55" y="399" font-size="21" font-weight="400">记录命令、状态转移与观察</text><path d="M275,442 L275,492" fill="none" stroke="#245b9e" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="505" width="480" height="140" rx="16" fill="#fff2df" stroke="#8daed2"/><text x="55" y="541" font-size="24" font-weight="700">5  数据检查与训练</text><text x="55" y="578" font-size="21" font-weight="400">同步、字段有效性、派生关系</text><text x="55" y="609" font-size="21" font-weight="400">分组划分后训练与消融</text><path d="M522,575 L575,575" fill="none" stroke="#245b9e" stroke-width="3" marker-end="url(#arrow)"/><rect x="585" y="505" width="480" height="140" rx="16" fill="#fff2df" stroke="#8daed2"/><text x="605" y="541" font-size="24" font-weight="700">6  独立真机评测</text><text x="605" y="578" font-size="21" font-weight="400">检查预测、规划与任务执行表现</text><text x="605" y="609" font-size="21" font-weight="400">将失败反馈到环境与数据设计</text><text x="35" y="687" font-size="22" font-weight="700">视觉一致性、物理可信度和闭环成功率分别验收。</text></g></svg>