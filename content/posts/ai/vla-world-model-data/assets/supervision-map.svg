<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 670" role="img" aria-labelledby="title desc"><title id="title">数据来源与监督目标</title><desc id="desc">三类来源经不同处理形成机器人动作、人体动作或时序与空间监督。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#526782"/></marker></defs><rect width="1100" height="670" rx="22" fill="#f8faff"/><g font-family="system-ui, Noto Sans CJK SC, sans-serif" fill="#18334f"><text x="35" y="48" font-size="30" font-weight="700">先确认标签是什么，再选择训练目标</text><rect x="35" y="95" width="300" height="140" rx="16" fill="#e5effb" stroke="#b4c7dd"/><text x="55" y="131" font-size="24" font-weight="700">真实机器人</text><text x="55" y="168" font-size="21" font-weight="400">VR / 主从 / 自主交互</text><text x="55" y="199" font-size="21" font-weight="400">图像 + 命令 + 状态</text><path d="M341,165 L385,165" fill="none" stroke="#526782" stroke-width="3" marker-end="url(#arrow)"/><rect x="395" y="95" width="310" height="140" rx="16" fill="#ede8fb" stroke="#b4c7dd"/><text x="415" y="131" font-size="24" font-weight="700">执行与时间契约</text><text x="415" y="168" font-size="21" font-weight="400">坐标、单位、控制模式</text><text x="415" y="199" font-size="21" font-weight="400">目标命令与反馈分离</text><path d="M711,165 L755,165" fill="none" stroke="#526782" stroke-width="3" marker-end="url(#arrow)"/><rect x="765" y="95" width="300" height="140" rx="16" fill="#fff0d9" stroke="#b4c7dd"/><text x="785" y="131" font-size="24" font-weight="700">具身动作监督</text><text x="785" y="168" font-size="21" font-weight="400">VLA / 模仿学习</text><text x="785" y="199" font-size="21" font-weight="400">动作条件世界模型</text><rect x="35" y="265" width="300" height="140" rx="16" fill="#e5effb" stroke="#b4c7dd"/><text x="55" y="301" font-size="24" font-weight="700">人类示范</text><text x="55" y="338" font-size="21" font-weight="400">UMI / 追踪 / 普通视频</text><text x="55" y="369" font-size="21" font-weight="400">工具、人体或仅 RGB</text><path d="M341,335 L385,335" fill="none" stroke="#526782" stroke-width="3" marker-end="url(#arrow)"/><rect x="395" y="265" width="310" height="140" rx="16" fill="#ede8fb" stroke="#b4c7dd"/><text x="415" y="301" font-size="24" font-weight="700">显式映射或表征学习</text><text x="415" y="338" font-size="21" font-weight="400">姿态、计划、潜在动作</text><text x="415" y="369" font-size="21" font-weight="400">缺失量与估计量单独标记</text><path d="M711,335 L755,335" fill="none" stroke="#526782" stroke-width="3" marker-end="url(#arrow)"/><rect x="765" y="265" width="300" height="140" rx="16" fill="#fff0d9" stroke="#b4c7dd"/><text x="785" y="301" font-size="24" font-weight="700">分层或联合学习</text><text x="785" y="338" font-size="21" font-weight="400">可迁移先验 + 机器人适配</text><text x="785" y="369" font-size="21" font-weight="400">无动作时序预训练</text><rect x="35" y="435" width="300" height="140" rx="16" fill="#e5effb" stroke="#b4c7dd"/><text x="55" y="471" font-size="24" font-weight="700">仿真与生成环境</text><text x="55" y="508" font-size="21" font-weight="400">源示范 / 自动执行</text><text x="55" y="539" font-size="21" font-weight="400">场景资产 + 模拟器</text><path d="M341,505 L385,505" fill="none" stroke="#526782" stroke-width="3" marker-end="url(#arrow)"/><rect x="395" y="435" width="310" height="140" rx="16" fill="#ede8fb" stroke="#b4c7dd"/><text x="415" y="471" font-size="24" font-weight="700">执行与质量验证</text><text x="415" y="508" font-size="21" font-weight="400">物理、传感器、任务检查</text><text x="415" y="539" font-size="21" font-weight="400">保留源示范与派生关系</text><path d="M711,505 L755,505" fill="none" stroke="#526782" stroke-width="3" marker-end="url(#arrow)"/><rect x="765" y="435" width="300" height="140" rx="16" fill="#fff0d9" stroke="#b4c7dd"/><text x="785" y="471" font-size="24" font-weight="700">交互与空间监督</text><text x="785" y="508" font-size="21" font-weight="400">策略 / 动作后果预测</text><text x="785" y="539" font-size="21" font-weight="400">空间重建与场景扩展</text><text x="35" y="623" font-size="23" font-weight="700">人体姿态 ≠ 机器人命令；相机条件 ≠ 机器人动作条件</text></g></svg>