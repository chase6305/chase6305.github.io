<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc"><title id="title">Zero-failure binomial upper bound</title><desc id="desc">The exact one-sided 95 percent failure probability upper bound decreases as the number of independent fixed-policy trials grows. At one thousand zero-failure trials it remains about 0.299 percent. The x axis is logarithmic.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}</style><rect width="1120" height="620" fill="white"/><text x="30" y="43" font-size="28" text-anchor="start" font-weight="bold">Zero failures do not imply zero failure probability</text><text x="30" y="80" font-size="19" text-anchor="start" font-weight="normal">One-sided 95% exact binomial upper bound; fixed policy and IID trials.</text><path d="M95.0000,130.0000 L95.0000,430.0000 L1030.0000,430.0000" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray=""/><text x="95.0" y="457" font-size="17" text-anchor="middle" font-weight="normal">10</text><text x="406.6666666666667" y="457" font-size="17" text-anchor="middle" font-weight="normal">100</text><text x="718.3333333333334" y="457" font-size="17" text-anchor="middle" font-weight="normal">1000</text><text x="1030.0" y="457" font-size="17" text-anchor="middle" font-weight="normal">10000</text><path d="M95.0000,430.0000 L1030.0000,430.0000" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 5"/><text x="82" y="436.0" font-size="17" text-anchor="end" font-weight="normal">0</text><path d="M95.0000,380.0000 L1030.0000,380.0000" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 5"/><text x="82" y="386.0" font-size="17" text-anchor="end" font-weight="normal">5</text><path d="M95.0000,330.0000 L1030.0000,330.0000" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 5"/><text x="82" y="336.0" font-size="17" text-anchor="end" font-weight="normal">10</text><path d="M95.0000,280.0000 L10