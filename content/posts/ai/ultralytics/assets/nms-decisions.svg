<svg xmlns="http://www.w3.org/2000/svg" width="1134" height="568" viewBox="0 0 1134 568" role="img" aria-labelledby="title desc"><title id="title">Class-aware and class-agnostic greedy NMS example</title><desc id="desc">Three candidate boxes illustrate how changing class handling or IoU threshold changes suppression. B and C occupy the same coordinates but represent different classes.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}</style><rect width="1134" height="568" fill="white"/><text x="28" y="42" font-size="26" font-weight="bold" text-anchor="start">NMS: overlap, class and threshold are separate decisions</text><text x="28" y="74" font-size="19" font-weight="normal" text-anchor="start">A: class 0, score 0.95; B: class 0, score 0.90; C: class 1, score 0.85</text><text x="28" y="102" font-size="18" font-weight="normal" text-anchor="start">A = (0,0)-(100,100); B and C = (10,10)-(110,110); IoU(A,B) = 81/119 = 0.680672...</text><rect x="20" y="130" width="354" height="340" fill="#fafbff" stroke="#cbd5e1" stroke-width="2" rx="14"/><text x="36" y="167" font-size="19" font-weight="bold" text-anchor="start">Class-aware, IoU &gt; 0.5</text><rect x="70" y="196" width="170" height="170" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" /><text x="82" y="223" font-size="22" font-weight="bold" text-anchor="start">A</text><rect x="87" y="213" width="170" height="170" fill="none" stroke="#9a3412" stroke-width="2" stroke-dasharray="10 5"/><text x="36" y="424" font-size="23" font-weight="bold" text-anchor="start">Keep A and C</text><text x="36" y="452" font-size="19" font-weight="normal" text-anchor="start">B suppressed by A</text><rect x="390" y="130" width="354" height="340" fill="#fafbff" stroke="#cbd5e1" stroke-width="2" rx="14"/><text x="406" y="167" font-size="19" font-weight="bold" text-anchor="start">Class-agnostic, IoU &gt; 0.5</text><rect x="440" y="196" width="170" height="170" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" /><text x="452" y="223" font-size="22" font-weight="bold" text-anchor="start">A</text><text x="406" y="424" font-size="23" font-weight="bold" text-anchor="start">Keep A only</text><text x="406" y="452" font-size="19" font-weight="normal" text-anchor="start">B suppressed by A</text><rect x="760" y="130" width="354" height="340" fill="#fafbff" stroke="#cbd5e1" stroke-width="2" rx="14"/><text x="776" y="167" font-size="19" font-weight="bold" text-anchor="start">Class-aware, IoU &gt; 0.7</text><rect x="810" y="196" width="170" height="170" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" /><text x="822" y="223" font-size="22" font-weight="bold" text-anchor="start">A</text><rect x="827" y="213" width="170" height="170" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="3 4"/><rect x="827" y="213" width="170" height="170" fill="none" stroke="#9a3412" stroke-width="2" stroke-dasharray="10 5"/><text x="776" y="424" font-size="23" font-weight="bold" text-anchor="start">Keep A, B and C</text><text x="776" y="452" font-size="19" font-weight="normal" text-anchor="start">B retained</text><text x="28" y="510" font-size="19" font-weight="normal" text-anchor="start">Confidence filtering happens before this example; all three scores already pass it.</text><text x="28" y="540" font-size="19" font-weight="normal" text-anchor="start">These are constructed boxes. NMS-free end-to-end filtering follows a different path.</text></svg>
