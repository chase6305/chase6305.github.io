<svg xmlns="http://www.w3.org/2000/svg" width="1134" height="662" viewBox="0 0 1134 662" role="img" aria-labelledby="title desc"><title id="title">LetterBox square versus stride-minimal padding</title><desc id="desc">1280 by 720 becomes 640 by 360 content. Square padding is 140 pixels per side; stride-minimal padding is 12 per side with a 640 by 384 output.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}</style><rect width="1134" height="662" fill="white"/><text x="30" y="42" font-size="28" font-weight="bold" text-anchor="start">Same image, different padding</text><text x="30" y="76" font-size="18" font-weight="normal" text-anchor="start">Continuous box edges; target 640 x 640; centered padding; stride 32</text><rect x="20" y="104" width="354" height="470" fill="#fafbff" stroke="#cbd5e1" stroke-width="2" rx="14"/><text x="38" y="138" font-size="23" font-weight="bold" text-anchor="start">Original</text><text x="38" y="168" font-size="20" font-weight="normal" text-anchor="start">1280 x 720 px</text><rect x="42" y="198" width="310" height="174.375" fill="#eff6ff" stroke="#334155" stroke-width="2" /><rect x="119.5" y="241.594" width="155" height="87.1875" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="8 4"/><text x="38" y="537" font-size="17" font-weight="normal" text-anchor="start">r = 1; No padding</text><text x="38" y="560" font-size="17" font-weight="normal" text-anchor="start">Box: (320,180)-(960,540)</text><rect x="390" y="104" width="354" height="470" fill="#fafbff" stroke="#cbd5e1" stroke-width="2" rx="14"/><text x="408" y="138" font-size="23" font-weight="bold" text-anchor="start">Fixed square</text><text x="408" y="168" font-size="20" font-weight="normal" text-anchor="start">640 x 640 px</text><rect x="412" y="198" width="310" height="310" fill="#ffedd5" stroke="#334155" stroke-width="2" /><rect x="412" y="265.812" width="310" height="174.375" fill="#eff6ff" stroke="#64748b" stroke-width="2" /><rect x="489.5" y="309.406" width="155" height="87.1875" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="8 4"/><text x="408" y="537" font-size="17" font-weight="normal" text-anchor="start">r = 0.5; Top / bottom: 140 px each</text><text x="408" y="560" font-size="17" font-weight="normal" text-anchor="start">Box: (160,230)-(480,410)</text><rect x="760" y="104" width="354" height="470" fill="#fafbff" stroke="#cbd5e1" stroke-width="2" rx="14"/><text x="778" y="138" font-size="23" font-weight="bold" text-anchor="start">Minimal rectangle</text><text x="778" y="168" font-size="20" font-weight="normal" text-anchor="start">640 x 384 px</text><rect x="782" y="198" width="310" height="186" fill="#ffedd5" stroke="#334155" stroke-width="2" /><rect x="782" y="203.812" width="310" height="174.375" fill="#eff6ff" stroke="#64748b" stroke-width="2" /><rect x="859.5" y="247.406" width="155" height="87.1875" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="8 4"/><text x="778" y="537" font-size="17" font-weight="normal" text-anchor="start">r = 0.5; Top / bottom: 12 px each</text><text x="778" y="560" font-size="17" font-weight="normal" text-anchor="start">Box: (160,102)-(480,282)</text><text x="30" y="609" font-size="18" font-weight="normal" text-anchor="start">Blue dashed box = same object; orange area = padding. Panels are fitted to equal display widths.</text><text x="30" y="638" font-size="18" font-weight="normal" text-anchor="start">Invert using the transform actually applied: x = (x' - left) / r; y = (y' - top) / r.</text></svg>
