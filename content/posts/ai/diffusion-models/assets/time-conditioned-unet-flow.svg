<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title"><title id="title">Time-conditioned U-Net feature path and optional cross-attention</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033" font-size="22">
<g id="xt"><rect x="40" y="230" width="100" height="65" rx="12" fill="#eaf2ff" stroke="#64748b" stroke-width="1.5"/>
<text x="90.0" y="270.5" text-anchor="middle" font-size="22">x_t</text>
</g>
<g id="encoder"><rect x="210" y="230" width="180" height="65" rx="12" fill="#eaf2ff" stroke="#64748b" stroke-width="1.5"/>
<text x="300.0" y="270.5" text-anchor="middle" font-size="22">Encoder</text>
</g>
<g id="middle"><rect x="210" y="425" width="180" height="65" rx="12" fill="#eaf2ff" stroke="#64748b" stroke-width="1.5"/>
<text x="300.0" y="465.5" text-anchor="middle" font-size="22">Middle features</text>
</g>
<g id="attention"><rect x="530" y="425" width="180" height="65" rx="12" fill="#fff3d6" stroke="#64748b" stroke-width="1.5"/>
<text x="620.0" y="465.5" text-anchor="middle" font-size="22">Cross-attention</text>
</g>
<g id="decoder"><rect x="530" y="230" width="180" height="65" rx="12" fill="#f6ebff" stroke="#64748b" stroke-width="1.5"/>
<text x="620.0" y="270.5" text-anchor="middle" font-size="22">Decoder</text>
</g>
<g id="head"><rect x="790" y="230" width="170" height="65" rx="12" fill="#eaf2ff" stroke="#64748b" stroke-width="1.5"/>
<text x="875.0" y="270.5" text-anchor="middle" font-size="22">Prediction head</text>
</g>
<g id="condition"><rect x="530" y="535" width="180" height="55" rx="12" fill="#fff3d6" stroke="#64748b" stroke-width="1.5"/>
<text x="620.0" y="570.5" text-anchor="middle" font-size="22">Condition c</text>
</g>
<g id="time"><rect x="40" y="50" width="100" height="55" rx="12" fill="#eaf7e8" stroke="#64748b" stroke-width="1.5"/>
<text x="90.0" y="85.5" text-anchor="middle" font-size="22">t</text>
</g>
<g id="embedding"><rect x="300" y="50" width="220" height="55" rx="12" fill="#eaf7e8" stroke="#64748b" stroke-width="1.5"/>
<text x="410.0" y="85.5" text-anchor="middle" font-size="22">Time embedding</text>
</g>
<polyline data-from="xt" data-to="encoder" points="140,262 210,262" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline data-from="encoder" data-to="middle" points="300,295 300,425" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline data-from="middle" data-to="attention" points="390,457 530,457" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="460" y="439" text-anchor="middle" font-size="18">Q: features</text>
<polyline data-from="condition" data-to="attention" points="620,535 620,490" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="675" y="521" text-anchor="middle" font-size="18">K / V</text>
<polyline data-from="attention" data-to="decoder" points="620,425 620,295" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline data-from="encoder" data-to="decoder" points="390,262 530,262" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="460" y="245" text-anchor="middle" font-size="18">Skip</text>
<polyline data-from="decoder" data-to="head" points="710,262 790,262" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline stroke-dasharray="6 4" data-from="time" data-to="embedding" points="140,77 300,77" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline stroke-dasharray="6 4" data-from="embedding" data-to="encoder" points="355,105 355,165 300,165 300,230" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline stroke-dasharray="6 4" data-from="embedding" data-to="middle" points="410,105 410,185 175,185 175,457 210,457" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline stroke-dasharray="6 4" data-from="embedding" data-to="decoder" points="465,105 465,145 620,145 620,230" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="875" y="330" text-anchor="middle" font-size="20">epsilon_theta</text>
<text x="270" y="560" text-anchor="middle" font-size="20">Dashed: time inputs</text>
</g></svg>
