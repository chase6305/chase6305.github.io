<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860" role="img" aria-labelledby="title"><title id="title">DDPM noise-prediction training and reverse sampling</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033" font-size="22">
<rect x="20" y="20" width="510" height="815" rx="18" fill="none" stroke="#94a3b8"/><rect x="560" y="20" width="520" height="815" rx="18" fill="none" stroke="#94a3b8"/>
<text x="275" y="65" text-anchor="middle" font-size="26">Training: update theta</text>
<text x="820" y="65" text-anchor="middle" font-size="26">Sampling: fixed theta</text>
<g id="clean"><rect x="40" y="110" width="100" height="55" rx="12" fill="#eaf2ff" stroke="#64748b" stroke-width="1.5"/>
<text x="90.0" y="145.5" text-anchor="middle" font-size="22">x_0</text>
</g>
<g id="random_t"><rect x="200" y="110" width="100" height="55" rx="12" fill="#eaf7e8" stroke="#64748b" stroke-width="1.5"/>
<text x="250.0" y="145.5" text-anchor="middle" font-size="22">Random t</text>
</g>
<g id="noise"><rect x="360" y="110" width="110" height="55" rx="12" fill="#eaf2ff" stroke="#64748b" stroke-width="1.5"/>
<text x="415.0" y="145.5" text-anchor="middle" font-size="22">Noise eps</text>
</g>
<g id="forward"><rect x="140" y="230" width="250" height="60" rx="12" fill="#eaf2ff" stroke="#64748b" stroke-width="1.5"/>
<text x="265.0" y="268.0" text-anchor="middle" font-size="22">Forward formula</text>
</g>
<g id="train_net"><rect x="140" y="365" width="250" height="65" rx="12" fill="#f6ebff" stroke="#64748b" stroke-width="1.5"/>
<text x="265.0" y="405.5" text-anchor="middle" font-size="22">Denoiser (x_t, t)</text>
</g>
<g id="prediction"><rect x="140" y="495" width="250" height="55" rx="12" fill="#eaf2ff" stroke="#64748b" stroke-width="1.5"/>
<text x="265.0" y="530.5" text-anchor="middle" font-size="22">Predicted eps</text>
</g>
<g id="loss"><rect x="140" y="630" width="250" height="55" rx="12" fill="#fff3d6" stroke="#64748b" stroke-width="1.5"/>
<text x="265.0" y="665.5" text-anchor="middle" font-size="22">MSE (prediction, eps)</text>
</g>
<g id="sample_xt"><rect x="690" y="110" width="240" height="55" rx="12" fill="#eaf2ff" stroke="#64748b" stroke-width="1.5"/>
<text x="810.0" y="145.5" text-anchor="middle" font-size="22">Current x_t</text>
</g>
<g id="sample_t"><rect x="590" y="240" width="100" height="55" rx="12" fill="#eaf7e8" stroke="#64748b" stroke-width="1.5"/>
<text x="640.0" y="275.5" text-anchor="middle" font-size="22">t</text>
</g>
<g id="sample_net"><rect x="750" y="240" width="270" height="55" rx="12" fill="#f6ebff" stroke="#64748b" stroke-width="1.5"/>
<text x="885.0" y="275.5" text-anchor="middle" font-size="22">Denoiser (x_t, t)</text>
</g>
<g id="sample_eps"><rect x="750" y="365" width="270" height="55" rx="12" fill="#eaf2ff" stroke="#64748b" stroke-width="1.5"/>
<text x="885.0" y="400.5" text-anchor="middle" font-size="22">Predicted eps</text>
</g>
<g id="step"><rect x="750" y="495" width="270" height="65" rx="12" fill="#fff3d6" stroke="#64748b" stroke-width="1.5"/>
<text x="885.0" y="535.5" text-anchor="middle" font-size="22">Reverse update</text>
</g>
<g id="next"><rect x="750" y="630" width="270" height="55" rx="12" fill="#eaf2ff" stroke="#64748b" stroke-width="1.5"/>
<text x="885.0" y="665.5" text-anchor="middle" font-size="22">x_(t-1)</text>
</g>
<g id="sample_z"><rect x="590" y="570" width="100" height="55" rx="12" fill="#eaf2ff" stroke="#64748b" stroke-width="1.5"/>
<text x="640.0" y="605.5" text-anchor="middle" font-size="22">z</text>
</g>
<polyline data-from="clean" data-to="forward" points="90,165 90,260 140,260" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline stroke-dasharray="6 4" data-from="random_t" data-to="forward" points="250,165 250,230" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline data-from="noise" data-to="forward" points="415,165 415,260 390,260" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline data-from="forward" data-to="train_net" points="265,290 265,365" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="290" y="332" text-anchor="middle" font-size="18">x_t</text>
<polyline stroke-dasharray="6 4" data-from="random_t" data-to="train_net" points="300,137 325,137 325,185 490,185 490,397 390,397" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="460" y="345" text-anchor="middle" font-size="18">t</text>
<polyline data-from="train_net" data-to="prediction" points="265,430 265,495" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline data-from="prediction" data-to="loss" points="265,550 265,630" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline data-from="noise" data-to="loss" points="470,137 510,137 510,657 390,657" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline data-from="loss" data-to="train_net" points="140,657 70,657 70,397 140,397" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="80" y="580" text-anchor="middle" font-size="18">Gradients</text>
<polyline data-from="sample_xt" data-to="sample_net" points="850,165 850,240" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline stroke-dasharray="6 4" data-from="sample_t" data-to="sample_net" points="690,267 750,267" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline data-from="sample_net" data-to="sample_eps" points="885,295 885,365" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline data-from="sample_eps" data-to="step" points="885,420 885,495" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline data-from="sample_xt" data-to="step" points="930,137 1050,137 1050,527 1020,527" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1048" y="460" text-anchor="middle" font-size="18">x_t</text>
<polyline stroke-dasharray="6 4" data-from="sample_t" data-to="step" points="640,295 640,527 750,527" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="695" y="515" text-anchor="middle" font-size="18">t</text>
<polyline data-from="sample_z" data-to="step" points="640,570 640,550 750,550" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline data-from="step" data-to="next" points="885,560 885,630" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polyline data-from="next" data-to="sample_xt" points="1020,657 1065,657 1065,90 810,90 810,110" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="275" y="745" text-anchor="middle" font-size="20">Same sampled t enters both paths</text>
<text x="275" y="780" text-anchor="middle" font-size="20">Dashed: time inputs</text>
<text x="820" y="710" text-anchor="middle" font-size="20">Repeat with t &lt;- t-1</text>
<text x="820" y="745" text-anchor="middle" font-size="20">Start x_T ~ N(0,I); t = T,...,1</text>
<text x="820" y="780" text-anchor="middle" font-size="20">No gradients; stop after x_0</text>
</g></svg>
