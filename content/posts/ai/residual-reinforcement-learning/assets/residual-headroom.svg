1" stroke-width="1" stroke-dasharray=""/><text x="94" y="419.0" font-size="18" text-anchor="end" font-weight="normal">-1</text><path d="M108.0000,333.0000 L698.0000,333.0000" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray=""/><text x="94" y="339.0" font-size="18" text-anchor="end" font-weight="normal">0</text><path d="M108.0000,253.0000 L698.0000,253.0000" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray=""/><text x="94" y="259.0" font-size="18" text-anchor="end" font-weight="normal">1</text><path d="M108.0000,173.0000 L698.0000,173.0000" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray=""/><text x="94" y="179.0" font-size="18" text-anchor="end" font-weight="normal">2</text><path d="M108.0000,533.0000 L698.0000,533.0000" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray=""/><path d="M108.0000,133.0000 L108.0000,533.0000" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray=""/><text x="403.0" y="602" font-size="20" text-anchor="middle" font-weight="normal">Nominal command b</text><text x="30" y="116" font-size="19" text-anchor="start" font-weight="normal">Residual a</text><rect x="735" y="133" width="350" height="400" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="755" y="170" font-size="24" text-anchor="start" font-weight="bold">Examples</text><text x="755" y="212" font-size="19" text-anchor="start" font-weight="normal">b = 0.0:  a in [-1.0, 1.0]</text><text x="755" y="248" font-size="19" text-anchor="start" font-weight="normal">b = 0.9:  a in [-1.9, 0.1]</text><text x="755" y="300" font-size="19" text-anchor="start" font-weight="bold">Also require |a| &lt;= 0.4:</text><text x="755" y="337" font-size="19" text-anchor="start" font-weight="normal">b = 0.9:  a in [-0.4, 0.1]</text><text x="755" y="373" font-size="19" text-anchor="start" font-weight="normal">b = 1.5:  no feasible residual</text><text x="755" y="435" font-size="18" text-anchor="start" font-weight="normal">Blue: total-action limit</text><text x="755" y="467" font-size="18" text-anchor="start" font-weight="normal">Orange: intersection with</text><text x="755" y="494" font-size="18" text-anchor="start" font-weight="normal">the extra residual radius</text><text x="30" y="650" font-size="20" text-anchor="start" font-weight="normal">Command bounds alone do not verify contacts, collision avoidance or stability.</text></svg>
