<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc"><title id="title">Residual action headroom</title><desc id="desc">An exact feasible strip shows the residual interval imposed by total-command bounds. The orange intersection adds a fixed residual radius of 0.4; a baseline of 1.5 has no feasible residual under that extra restriction.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}</style><rect width="1120" height="680" fill="white"/><text x="30" y="43" font-size="28" text-anchor="start" font-weight="bold">Residual authority depends on the nominal command</text><text x="30" y="80" font-size="20" text-anchor="start" font-weight="normal">Constructed scalar interface: total command u = b + a, with -1 &lt;= u &lt;= 1.</text><polygon points="108.0000,293.0000 698.0000,533.0000 698.0000,373.0000 108.0000,133.0000" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><polygon points="127.6667,301.0000 133.1733,303.2400 138.6800,305.4800 144.1867,307.7200 149.6933,309.9600 155.2000,312.2000 160.7067,314.4400 166.2133,316.6800 171.7200,318.9200 177.2267,321.1600 182.7333,323.4000 188.2400,325.6400 193.7467,327.8800 199.2533,330.1200 204.7600,332.3600 210.2667,334.6000 215.7733,336.8400 221.2800,339.0800 226.7867,341.3200 232.2933,343.5600 237.8000,345.8000 243.3067,348.0400 248.8133,350.2800 254.3200,352.5200 259.8267,354.7600 265.3333,357.0000 270.8400,359.2400 276.3467,361.4800 281.8533,363.7200 287.3600,365.0000 292.8667,365.0000 298.3733,365.0000 303.8800,365.0000 309.3867,365.0000 314.8933,365.0000 320.4000,365.0000 325.9067,365.0000 331.4133,365.0000 336.9200,365.0000 342.4267,365.0000 347.9333,365.0000 353.4400,365.0000 358.9467,365.0000 364.4533,365.0000 369.9600,365.0000 375.4667,365.0000 380.9733,365.0000 386.4800,365.0000 391.9867,365.0000 397.4933,365.0000 403.0000,365.0000 408.5067,365.0000 414.0133,365.0000 419.5200,365.0000 425.0267,365.0000 430.5333,365.0000 436.0