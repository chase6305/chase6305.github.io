<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc"><title id="title">One world target under two action anchors</title><desc id="desc">The old anchor is at position one, zero with ninety-degree rotation. The new anchor is at one, one with zero rotation. The unchanged world target at two, one and ninety degrees has old-relative pose one, minus one, zero degrees, and new-relative pose one, zero, ninety degrees. Dashed lines show displacement; labeled local axes show orientation.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}</style><rect width="1120" height="700" fill="white"/><text x="30" y="43" font-size="28" text-anchor="start" font-weight="bold">Reanchor one unchanged world target</text><text x="30" y="80" font-size="20" text-anchor="start" font-weight="normal">Constructed SE(2) example: target = (2 m, 1 m, 90 deg); the world frame is fixed.</text><rect x="35" y="112" width="510" height="478" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="290" y="151" font-size="24" text-anchor="middle" font-weight="bold">Old anchor</text><path d="M225.0000,440.0000 L225.0000,200.0000" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray=""/><path d="M345.0000,440.0000 L345.0000,200.0000" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray=""/><path d="M465.0000,440.0000 L465.0000,200.0000" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray=""/><path d="M105.0000,320.0000 L465.0000,320.0000" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray=""/><path d="M105.0000,200.0000 L465.0000,200.0000" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray=""/><path d="M105.0000,440.0000 L483.0000,440.0000" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray=""/><polygon points="483.000,440.000 473.000,445.000 473.000,435.000" fill="#64748b"/><path d="M105.0000,440.0000 L105.0000,180.0000" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray=""/><polygon points="105.000,180.000 110.000,190.000 100.000,190.000" fill="#64748b"/><text x="105" y="465" font-size="17" text-anchor="middle" font-weight="normal">0</text><text x="225" y="465" font-size="17" text-anchor="middle" font-weight="normal">1</text><text x="345" y="465" font-size="17" text-anchor="middle" font-weight="normal">2</text><text x="465" y="465" font-size="17" text-anchor="middle" font-weight="normal">3</text><text x="90" y="326" font-size="17" text-anchor="end" font-weight="normal">1</text><text x="90" y="206" font-size="17" text-anchor="end" font-weight="normal">2</text><text x="489" y="447" font-size="17" text-anchor="start" font-weight="normal">x_W</text><text x="115" y="187" font-size="17" text-anchor="start" font-weight="normal">y_W</text><path d="M225.0000,440.0000 L345.0000,320.0000" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5"/><path d="M225.0000,440.0000 L225.0000,377.6000" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray=""/><polygon points="225.000,377.600 230.000,387.600 220.000,387.600" fill="#b91c1c"/><text x="235.0" y="369.6" font-size="17" text-anchor="start" font-weight="normal">x_local</text><path d="M225.0000,440.0000 L162.6000,440.0000" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray=""/><polygon points="162.600,440.000 172.600,435.000 172.600,445.000" fill="#0f766e"/><text x="193.8" y="426.0" font-size="17" text-anchor="middle" font-weight="normal">y_local</text><circle cx="225.0" cy="440.0" r="7" fill="white" stroke="#1d4ed8" stroke-width="3"/><path d="M345.0000,320.0000 L345.0000,268.0000" fill="none" stroke="#166534" stroke-width="3" stroke-dasharray=""/><polygon points="345.000,268.000 350.000,278.000 340.000,278.000" fill="#166534"/><path d="M338.0,320.0 L345.0,313.0 L352.0,320.0 L345.0,327.0 Z" fill="#166534"/><text x="345.0" y="243.0" font-size="19" text-anchor="middle" font-weight="bold">Target</text><text x="290" y="498" font-size="20" text-anchor="middle" font-weight="normal">Old anchor: (1, 0, 90 deg)</text><rect x="60" y="522" width="460" height="50" rx="8" fill="#ede9fe" stroke="#cbd5e1"/><text x="290" y="555" font-size="24" text-anchor="middle" font-weight="bold">A_old = (1, -1, 0 deg)</text><rect x="575" y="112" width="510" height="478" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="830" y="151" font-size="24" text-anchor="middle" font-weight="bold">New anchor</text><path d="M765.0000,440.0000 L765.0000,200.0000" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray=""/><path d="M885.0000,440.0000 L885.0000,200.0000" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray=""/><path d="M1005.0000,440.0000 L1005.0000,200.0000" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray=""/><path d="M645.0000,320.0000 L1005.0000,320.0000" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray=""/><path d="M645.0000,200.0000 L1005.0000,200.0000" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray=""/><path d="M645.0000,440.0000 L1023.0000,440.0000" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray=""/><polygon points="1023.000,440.000 1013.000,445.000 1013.000,435.000" fill="#64748b"/><path d="M645.0000,440.0000 L645.0000,180.0000" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray=""/><polygon points="645.000,180.000 650.000,190.000 640.000,190.000" fill="#64748b"/><text x="645" y="465" font-size="17" text-anchor="middle" font-weight="normal">0</text><text x="765" y="465" font-size="17" text-anchor="middle" font-weight="normal">1</text><text x="885" y="465" font-size="17" text-anchor="middle" font-weight="normal">2</text><text x="1005" y="465" font-size="17" text-anchor="middle" font-weight="normal">3</text><text x="630" y="326" font-size="17" text-anchor="end" font-weight="normal">1</text><text x="630" y="206" font-size="17" text-anchor="end" font-weight="normal">2</text><text x="1029" y="447" font-size="17" text-anchor="start" font-weight="normal">x_W</text><text x="655" y="187" font-size="17" text-anchor="start" font-weight="normal">y_W</text><path d="M765.0000,320.0000 L885.0000,320.0000" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5"/><path d="M765.0000,320.0000 L827.4000,320.0000" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray=""/><polygon points="827.400,320.000 817.400,325.000 817.400,315.000" fill="#b91c1c"/><text x="825.4" y="350.0" font-size="17" text-anchor="middle" font-weight="normal">x_local</text><path d="M765.0000,320.0000 L765.0000,257.6000" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray=""/><polygon points="765.000,257.600 770.000,267.600 760.000,267.600" fill="#0f766e"/><text x="775.0" y="249.60000000000002" font-size="17" text-anchor="start" font-weight="normal">y_local</text><circle cx="765.0" cy="320.0" r="7" fill="white" stroke="#6d28d9" stroke-width="3"/><path d="M885.0000,320.0000 L885.0000,268.0000" fill="none" stroke="#166534" stroke-width="3" stroke-dasharray=""/><polygon points="885.000,268.000 890.000,278.000 880.000,278.000" fill="#166534"/><path d="M878.0,320.0 L885.0,313.0 L892.0,320.0 L885.0,327.0 Z" fill="#166534"/><text x="885.0" y="243.0" font-size="19" text-anchor="middle" font-weight="bold">Target</text><text x="830" y="498" font-size="20" text-anchor="middle" font-weight="normal">New anchor: (1, 1, 0 deg)</text><rect x="600" y="522" width="460" height="50" rx="8" fill="#ede9fe" stroke="#cbd5e1"/><text x="830" y="555" font-size="24" text-anchor="middle" font-weight="bold">A_new = (1, 0, 90 deg)</text><text x="560" y="633" font-size="24" text-anchor="middle" font-weight="bold">A_new = inverse(T_new) * T_old * A_old</text><text x="560" y="673" font-size="20" text-anchor="middle" font-weight="normal">Convert coordinates so both commands reconstruct the same world pose.</text></svg>
