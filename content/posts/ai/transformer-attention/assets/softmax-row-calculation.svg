<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="770" viewBox="0 0 1400 770" role="img" aria-labelledby="title desc">
<title id="title">Stable row-wise softmax: unmasked and masked examples</title>
<desc id="desc">For scores 2, 1, 0, subtract 2, exponentiate, sum and normalize to approximately 0.665, 0.245, 0.090. Masking the third key gives 0.731, 0.269, 0.000. Each row sums to one; displayed values are rounded.</desc>
<metadata id="calculation-records">[{"name": "Unmasked", "scores": [2.0, 1.0, 0.0], "maximum": 2.0, "shifted": [0.0, -1.0, -2.0], "exponents": [1.0, 0.36787944117144233, 0.1353352832366127], "total": 1.5032147244080551, "probabilities": [0.6652409557748218, 0.24472847105479764, 0.09003057317038046]}, {"name": "Third key masked", "scores": [2.0, 1.0, null], "maximum": 2.0, "shifted": [0.0, -1.0, null], "exponents": [1.0, 0.36787944117144233, 0.0], "total": 1.3678794411714423, "probabilities": [0.7310585786300049, 0.2689414213699951, 0.0]}]</metadata>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#536174"/></marker>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #233148; }
    .title { font-size: 32px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #475569; }
    .heading { font-size: 20px; font-weight: 700; }
    .label { font-size: 18px; font-weight: 700; }
    .value { font-family: "DejaVu Sans Mono", monospace; font-size: 21px; }
    .small { font-size: 16px; fill: #475569; }
    .tiny { font-size: 14px; fill: #475569; }
    .formula { font-size: 23px; }
    .arrow { stroke: #536174; stroke-width: 2; fill: none; stroke-linejoin: round; marker-end: url(#arrow); }
  </style>
</defs>
<rect width="1400" height="770" fill="#ffffff"/>
<text x="48" y="49" text-anchor="start" class="title">Stable row-wise Softmax</text>
<text x="48" y="82" text-anchor="start" class="subtitle">One query row · normalize over the key positions (last axis)</text>
<rect x="32" y="112" width="1336" height="266" rx="16" fill="#ffffff" stroke="#c9d2df" stroke-width="1.6"/>
<text x="51" y="143" text-anchor="start" class="heading">A · Unmasked: z = [2.000, 1.000, 0.000]</text>
<rect x="48" y="164" width="160" height="194" rx="12" fill="#f3effb" stroke="#9b87bb" stroke-width="1.6"/>
<text x="128.0" y="193" text-anchor="middle" class="label">Scores z</text>
<rect x="242" y="164" width="210" height="194" rx="12" fill="#edf5ff" stroke="#7299c6" stroke-width="1.6"/>
<text x="347.0" y="193" text-anchor="middle" class="label">1  Subtract max</text>
<rect x="486" y="164" width="210" height="194" rx="12" fill="#fff3e5" stroke="#c49a6b" stroke-width="1.6"/>
<text x="591.0" y="193" text-anchor="middle" class="label">2  Exponentiate</text>
<rect x="730" y="164" width="194" height="194" rx="12" fill="#fff3e5" stroke="#c49a6b" stroke-width="1.6"/>
<text x="827.0" y="193" text-anchor="middle" class="label">3  Sum</text>
<rect x="960" y="164" width="392" height="194" rx="12" fill="#edf7ef" stroke="#83aa90" stroke-width="1.6"/>
<text x="1156.0" y="193" text-anchor="middle" class="label">4  Normalize</text>
<path d="M211,267 L238,267" class="arrow"/>
<path d="M455,267 L482,267" class="arrow"/>
<path d="M699,267 L726,267" class="arrow"/>
<path d="M927,267 L956,267" class="arrow"/>
<text x="128" y="239" text-anchor="middle" class="value">2.000</text>
<text x="347" y="239" text-anchor="middle" class="value">0.000</text>
<text x="591" y="239" text-anchor="middle" class="value">1.000</text>
<text x="128" y="277" text-anchor="middle" class="value">1.000</text>
<text x="347" y="277" text-anchor="middle" class="value">-1.000</text>
<text x="591" y="277" text-anchor="middle" class="value">0.368</text>
<text x="128" y="315" text-anchor="middle" class="value">0.000</text>
<text x="347" y="315" text-anchor="middle" class="value">-2.000</text>
<text x="591" y="315" text-anchor="middle" class="value">0.135</text>
<text x="347" y="213" text-anchor="middle" class="tiny">m = 2.000</text>
<text x="591" y="213" text-anchor="middle" class="tiny">exp(z − m)</text>
<text x="827" y="247" text-anchor="middle" class="small">1.000 + 0.368</text>
<text x="827" y="281" text-anchor="middle" class="small">+ 0.135</text>
<text x="827" y="326" text-anchor="middle" class="label">Z = 1.503</text>
<text x="1156" y="231" text-anchor="middle" class="value" style="font-size:18px">1.000 / 1.503 → 0.665</text>
<text x="1156" y="265" text-anchor="middle" class="value" style="font-size:18px">0.368 / 1.503 → 0.245</text>
<text x="1156" y="299" text-anchor="middle" class="value" style="font-size:18px">0.135 / 1.503 → 0.090</text>
<text x="1156" y="339" text-anchor="middle" class="label" id="row-0-sum" style="font-size:16px">0.665 + 0.245 + 0.090 = 1.000</text>
<rect x="32" y="398" width="1336" height="266" rx="16" fill="#ffffff" stroke="#c9d2df" stroke-width="1.6"/>
<text x="51" y="429" text-anchor="start" class="heading">B · Third key masked: z = [2.000, 1.000, −∞]</text>
<rect x="48" y="450" width="160" height="194" rx="12" fill="#f3effb" stroke="#9b87bb" stroke-width="1.6"/>
<text x="128.0" y="479" text-anchor="middle" class="label">Scores z</text>
<rect x="242" y="450" width="210" height="194" rx="12" fill="#edf5ff" stroke="#7299c6" stroke-width="1.6"/>
<text x="347.0" y="479" text-anchor="middle" class="label">1  Subtract max</text>
<rect x="486" y="450" width="210" height="194" rx="12" fill="#fff3e5" stroke="#c49a6b" stroke-width="1.6"/>
<text x="591.0" y="479" text-anchor="middle" class="label">2  Exponentiate</text>
<rect x="730" y="450" width="194" height="194" rx="12" fill="#fff3e5" stroke="#c49a6b" stroke-width="1.6"/>
<text x="827.0" y="479" text-anchor="middle" class="label">3  Sum</text>
<rect x="960" y="450" width="392" height="194" rx="12" fill="#edf7ef" stroke="#83aa90" stroke-width="1.6"/>
<text x="1156.0" y="479" text-anchor="middle" class="label">4  Normalize</text>
<path d="M211,553 L238,553" class="arrow"/>
<path d="M455,553 L482,553" class="arrow"/>
<path d="M699,553 L726,553" class="arrow"/>
<path d="M927,553 L956,553" class="arrow"/>
<text x="128" y="525" text-anchor="middle" class="value">2.000</text>
<text x="347" y="525" text-anchor="middle" class="value">0.000</text>
<text x="591" y="525" text-anchor="middle" class="value">1.000</text>
<text x="128" y="563" text-anchor="middle" class="value">1.000</text>
<text x="347" y="563" text-anchor="middle" class="value">-1.000</text>
<text x="591" y="563" text-anchor="middle" class="value">0.368</text>
<text x="128" y="601" text-anchor="middle" class="value">−∞</text>
<text x="347" y="601" text-anchor="middle" class="value">−∞</text>
<text x="591" y="601" text-anchor="middle" class="value">0.000</text>
<text x="347" y="499" text-anchor="middle" class="tiny">m = 2.000</text>
<text x="591" y="499" text-anchor="middle" class="tiny">exp(z − m)</text>
<text x="827" y="533" text-anchor="middle" class="small">1.000 + 0.368</text>
<text x="827" y="567" text-anchor="middle" class="small">+ 0.000</text>
<text x="827" y="612" text-anchor="middle" class="label">Z = 1.368</text>
<text x="1156" y="517" text-anchor="middle" class="value" style="font-size:18px">1.000 / 1.368 → 0.731</text>
<text x="1156" y="551" text-anchor="middle" class="value" style="font-size:18px">0.368 / 1.368 → 0.269</text>
<text x="1156" y="585" text-anchor="middle" class="value" style="font-size:18px">0.000 / 1.368 → 0.000</text>
<text x="1156" y="625" text-anchor="middle" class="label" id="row-1-sum" style="font-size:16px">0.731 + 0.269 + 0.000 = 1.000</text>
<text x="48" y="713" text-anchor="start" class="small">Displayed values are rounded to 3 decimals; normalization uses unrounded exponentials.</text>
<text x="48" y="744" text-anchor="start" class="small">Masked entry: exp(−∞) = 0 exactly. Each unrounded probability row sums to 1.</text>
</svg>
