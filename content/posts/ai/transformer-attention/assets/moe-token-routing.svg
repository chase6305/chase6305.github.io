<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc">
<title id="title">Constructed top-two MoE routing with separate token outputs</title>
<desc id="desc">Four one-hot token inputs route to four shared toy experts. Each token selects exactly two experts and applies softmax only to those two logits. Each lane combines its own two expert results; repeated expert labels refer to the same function E_j(x)=j x.</desc>
<metadata id="calculation-records">{"tokens": [{"token": 1, "x": ["1", "0", "0", "0"], "logits": ["2", "1", "0", "-1"], "chosen": [{"expert": 1, "weight": "0.7310585786300048792511592418218362743651446401650565192763659079190402", "gain": 1}, {"expert": 2, "weight": "0.2689414213699951207488407581781637256348553598349434807236340920809595", "gain": 2}], "gain": "1.268941421369995120748840758178163725634855359834943480723634092080959", "output": ["1.268941421369995120748840758178163725634855359834943480723634092080959", "0E-69", "0E-69", "0E-69"]}, {"token": 2, "x": ["0", "1", "0", "0"], "logits": ["0", "3", "1", "2"], "chosen": [{"expert": 2, "weight": "0.7310585786300048792511592418218362743651446401650565192763659079190402", "gain": 2}, {"expert": 4, "weight": "0.2689414213699951207488407581781637256348553598349434807236340920809595", "gain": 4}], "gain": "2.537882842739990241497681516356327451269710719669886961447268184161918", "output": ["0E-69", "2.537882842739990241497681516356327451269710719669886961447268184161918", "0E-69", "0E-69"]}, {"token": 3, "x": ["0", "0", "1", "0"], "logits": ["1", "-1", "3", "0"], "chosen": [{"expert": 3, "weight": "0.8807970779778824440597291413023967952063842986289682757984052500609769", "gain": 3}, {"expert": 1, "weight": "0.1192029220221175559402708586976032047936157013710317242015947499390234", "gain": 1}], "gain": "2.761594155955764888119458282604793590412768597257936551596810500121954", "output": ["0E-69", "0E-69", "2.761594155955764888119458282604793590412768597257936551596810500121954", "0E-69"]}, {"token": 4, "x": ["0", "0", "0", "1"], "logits": ["-1", "0", "1", "3"], "chosen": [{"expert": 4, "weight": "0.8807970779778824440597291413023967952063842986289682757984052500609769", "gain": 4}, {"expert": 3, "weight": "0.1192029220221175559402708586976032047936157013710317242015947499390234", "gain": 3}], "gain": "3.880797077977882444059729141302396795206384298628968275798405250060978", "output": ["0E-69", "0E-69", "0E-69", "3.880797077977882444059729141302396795206384298628968275798405250060978"]}], "top_k": 2, "expert_gains": [1, 2, 3, 4], "router_weight": [["2", "0", "1", "-1"], ["1", "3", "-1", "0"], ["0", "1", "3", "1"], ["-1", "2", "0", "3"]], "construction": "x_t=e_t in R4; router W_r transpose equals the displayed logits rows; E_j(x)=j*x"}</metadata>
