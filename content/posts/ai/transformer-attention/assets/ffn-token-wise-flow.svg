<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Position-wise feed-forward network</title>
  <desc id="desc">Every token independently passes through the same linear, GELU, dropout, and linear layers. The feature dimension expands from C to Cff and returns to C.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf5"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8f2ff"/><stop offset="1" stop-color="#c8dcff"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4de"/><stop offset="1" stop-color="#ffd79a"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#172554}.label{font:700 22px Arial,sans-serif;fill:#1e293b}.small{font:18px Arial,sans-serif;fill:#475569}.shape{font:700 19px Arial,sans-serif;fill:#1d4ed8}.box{stroke-width:2}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)" stroke="#dbe5f1"/>
  <text x="600" y="55" text-anchor="middle" class="title">Position-wise FFN: same MLP, independent tokens</text>

  <g transform="translate(55 115)">
    <text x="80" y="-18" text-anchor="middle" class="label">Input x</text>
    <rect x="0" y="0" width="160" height="58" rx="10" fill="url(#blue)" stroke="#3b82f6" class="box"/><text x="80" y="37" text-anchor="middle" class="small">token 1 · C</text>
    <rect x="0" y="72" width="160" height="58" rx="10" fill="url(#blue)" stroke="#3b82f6" class="box"/><text x="80" y="109" text-anchor="middle" class="small">token 2 · C</text>
    <rect x="0" y="144" width="160" height="58" rx="10" fill="url(#blue)" stroke="#3b82f6" class="box"/><text x="80" y="181" text-anchor="middle" class="small">token 3 · C</text>
    <text x="80" y="238" text-anchor="middle" class="shape">[B, T, C]</text>
  </g>

  <path d="M225 216 H300" class="arrow"/>
  <g transform="translate(310 130)">
    <rect width="180" height="180" rx="18" fill="#eef2ff" stroke="#6366f1" class="box"/>
    <text x="90" y="48" text-anchor="middle" class="label">Linear W₁</text>
    <text x="90" y="82" text-anchor="middle" class="small">C → Cff</text>
    <text x="90" y="119" text-anchor="middle" class="small">shared weights</text>
    <text x="90" y="147" text-anchor="middle" class="small">for all tokens</text>
  </g>
  <path d="M490 216 H555" class="arrow"/>
  <g transform="translate(565 130)">
    <rect width="145" height="180" rx="18" fill="url(#orange)" stroke="#f59e0b" class="box"/>
    <text x="72.5" y="68" text-anchor="middle" class="label">GELU</text>
    <text x="72.5" y="104" text-anchor="middle" class="small">nonlinear</text>
    <text x="72.5" y="134" text-anchor="middle" class="small">feature mixing</text>
  </g>
  <path d="M710 216 H765" class="arrow"/>
  <g transform="translate(775 130)">
    <rect width="145" height="180" rx="18" fill="#f3e8ff" stroke="#a855f7" class="box"/>
    <text x="72.5" y="78" text-anchor="middle" class="label">Dropout</text>
    <text x="72.5" y="116" text-anchor="middle" class="small">regularization</text>
  </g>
  <path d="M920 216 H965" class="arrow"/>
  <g transform="translate(975 130)">
    <rect width="180" height="180" rx="18" fill="#ecfdf5" stroke="#10b981" class="box"/>
    <text x="90" y="48" text-anchor="middle" class="label">Linear W₂</text>
    <text x="90" y="82" text-anchor="middle" class="small">Cff → C</text>
    <text x="90" y="122" text-anchor="middle" class="small">restore shape for</text>
    <text x="90" y="150" text-anchor="middle" class="small">residual addition</text>
  </g>

  <text x="400" y="350" text-anchor="middle" class="shape">[B, T, Cff]</text>
  <text x="637" y="350" text-anchor="middle" class="shape">[B, T, Cff]</text>
  <text x="1065" y="350" text-anchor="middle" class="shape">[B, T, C]</text>
  <rect x="245" y="405" width="710" height="92" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="442" text-anchor="middle" class="label">No communication along T</text>
  <text x="600" y="475" text-anchor="middle" class="small">Linear layers operate on the last dimension C; B and T are preserved.</text>
</svg>
