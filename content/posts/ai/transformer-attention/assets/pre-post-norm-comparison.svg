<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Post-Norm and Pre-Norm comparison</title>
  <desc id="desc">Post-Norm applies a sublayer, dropout, residual addition, then LayerNorm. Pre-Norm applies LayerNorm before the sublayer and keeps a direct residual path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fffaf5"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#172554}.head{font:700 29px Arial,sans-serif}.label{font:700 21px Arial,sans-serif;fill:#1e293b}.small{font:18px Arial,sans-serif;fill:#475569}.formula{font:italic 21px Georgia,serif;fill:#334155}.box{stroke-width:2}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}.skip{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" rx="24" fill="url(#bg)" stroke="#dbe5f1"/>
  <text x="600" y="52" text-anchor="middle" class="title">Residual path: Post-Norm vs Pre-Norm</text>

  <rect x="35" y="80" width="545" height="600" rx="22" fill="#f8f5ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="307" y="125" text-anchor="middle" class="head" fill="#6d28d9">Post-Norm</text>
  <text x="307" y="157" text-anchor="middle" class="formula">y = LN(x + Dropout(Sublayer(x)))</text>
  <g transform="translate(225 190)">
    <rect x="0" y="0" width="165" height="55" rx="11" fill="#dbeafe" stroke="#3b82f6" class="box"/><text x="82" y="35" text-anchor="middle" class="label">Input x</text>
    <path d="M82 55 V90" class="arrow"/>
    <rect x="0" y="100" width="165" height="62" rx="11" fill="#ede9fe" stroke="#8b5cf6" class="box"/><text x="82" y="139" text-anchor="middle" class="label">Sublayer</text>
    <path d="M82 162 V195" class="arrow"/>
    <rect x="0" y="205" width="165" height="55" rx="11" fill="#fff7ed" stroke="#f59e0b" class="box"/><text x="82" y="240" text-anchor="middle" class="label">Dropout</text>
    <path d="M82 260 V294" class="arrow"/>
    <circle cx="82" cy="320" r="25" fill="#fff" stroke="#334155" stroke-width="2"/><text x="82" y="328" text-anchor="middle" class="label">+</text>
    <path d="M82 345 V378" class="arrow"/>
    <rect x="0" y="388" width="165" height="55" rx="11" fill="#dcfce7" stroke="#22c55e" class="box"/><text x="82" y="423" text-anchor="middle" class="label">LayerNorm</text>
    <text x="178" y="423" class="small">→ output y</text>
    <path d="M0 27 H-95 V320 H52" class="skip"/>
  </g>

  <rect x="620" y="80" width="545" height="600" rx="22" fill="#f2fbf7" stroke="#10b981" stroke-width="2"/>
  <text x="892" y="125" text-anchor="middle" class="head" fill="#047857">Pre-Norm</text>
  <text x="892" y="157" text-anchor="middle" class="formula">y = x + Dropout(Sublayer(LN(x)))</text>
  <g transform="translate(810 190)">
    <rect x="0" y="0" width="165" height="55" rx="11" fill="#dbeafe" stroke="#3b82f6" class="box"/><text x="82" y="35" text-anchor="middle" class="label">Input x</text>
    <path d="M82 55 V90" class="arrow"/>
    <rect x="0" y="100" width="165" height="55" rx="11" fill="#dcfce7" stroke="#22c55e" class="box"/><text x="82" y="135" text-anchor="middle" class="label">LayerNorm</text>
    <path d="M82 155 V188" class="arrow"/>
    <rect x="0" y="198" width="165" height="62" rx="11" fill="#d1fae5" stroke="#10b981" class="box"/><text x="82" y="237" text-anchor="middle" class="label">Sublayer</text>
    <path d="M82 260 V293" class="arrow"/>
    <rect x="0" y="303" width="165" height="55" rx="11" fill="#fff7ed" stroke="#f59e0b" class="box"/><text x="82" y="338" text-anchor="middle" class="label">Dropout</text>
    <path d="M82 358 V391" class="arrow"/>
    <circle cx="82" cy="417" r="25" fill="#fff" stroke="#334155" stroke-width="2"/><text x="82" y="425" text-anchor="middle" class="label">+</text>
    <text x="120" y="425" class="small">→ output y</text>
    <path d="M0 27 H-95 V417 H52" class="skip"/>
  </g>

  <text x="307" y="722" text-anchor="middle" class="small">Normalization is after residual addition.</text>
  <text x="892" y="722" text-anchor="middle" class="small">The residual main path stays direct.</text>
</svg>
