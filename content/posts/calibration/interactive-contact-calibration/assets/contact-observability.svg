<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc"><title id="title">Local rank of contact geometry</title><desc id="desc">Three horizontal-plane rows constrain height, roll and pitch. A six-row constructed system with additional side normals and lever arms has full rank. Opposite normals on their own need not add an independent constraint.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}</style><rect width="1120" height="680" fill="white"/><text x="30" y="43" font-size="27" text-anchor="start" font-weight="bold">Contact observability: normals and lever arms both matter</text><text x="30" y="80" font-size="20" text-anchor="start" font-weight="normal">Constructed fixed point-plane correspondences; J = [ n^T, (p x n)^T ].</text><rect x="35" y="118" width="510" height="443" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="290" y="155" font-size="22" text-anchor="middle" font-weight="bold">Horizontal plane only</text><text x="290" y="191" font-size="24" text-anchor="middle" font-weight="bold">rank = 3</text><text x="145" y="238" font-size="19" text-anchor="middle" font-weight="bold">tx</text><text x="203" y="238" font-size="19" text-anchor="middle" font-weight="bold">ty</text><text x="261" y="238" font-size="19" text-anchor="middle" font-weight="bold">tz</text><text x="319" y="238" font-size="19" text-anchor="middle" font-weight="bold">rx</text><text x="377" y="238" font-size="19" text-anchor="middle" font-weight="bold">ry</text><text x="435" y="238" font-size="19" text-anchor="middle" font-weight="bold">rz</text><text x="145" y="280" font-size="21" text-anchor="middle" font-weight="normal">0</text><text x="203" y="280" font-size="21" text-anchor="middle" font-weight="normal">0</text><text x="261" y="280" font-size="21" text-anchor="middle" font-weight="normal">1</text><text x="319" y="280" font-size="21" text-anchor="middle" font-weight="normal">0</text><text x="377" y="280" font-size="21" text-anchor="middle" font-weight="normal">0</text><text x="435" y="280" font-size="21" text-anchor="middle" font-weight="normal">0</text><text x="145" y="319" font-size="21" text-anchor="middle" font-weight="normal">0</text><text x="203" y="319" font-size="21" text-anchor="middle" font-weight="normal">0</text><text x="261" y="319" font-size="21" text-anchor="middle" font-weight="normal">1</text><text x="319" y="319" font-size="21" text-anchor="middle" font-weight="normal">0</text><text x="377" y="319" font-size="21" text-anchor="middle" font-weight="normal">-1</text><text x="435" y="319" font-size="21" text-anchor="middle" font-weight="normal">0</text><text x="145" y="358" font-size="21" text-anchor="middle" font-weight="normal">0</text><text x="203" y="358" font-size="21" text-anchor="middle" font-weight="normal">0</text><text x="261" y="358" font-size="21" text-anchor="middle" font-weight="normal">1</text><text x="319" y="358" font-size="21" text-anchor="middle" font-weight="normal">1</text><text x="377" y="358" font-size="21" text-anchor="middle" font-weight="normal">0</text><text x="435" y="358" font-size="21" text-anchor="middle" font-weight="normal">0</text><path d="M113.0000,253.0000 L105.0000,253.0000 L105.0000,369.0000 L113.0000,369.0000" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray=""/><path d="M462.0000,253.0000 L470.0000,253.0000 L470.0000,369.0000 L462.0000,369.0000" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray=""/><rect x="575" y="118" width="510" height="443" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="830" y="155" font-size="22" text-anchor="middle" font-weight="bold">Diverse planes and positions</text><text x="830" y="191" font-size="24" text-anchor="middle" font-weight="bold">rank = 6</text><text x="685" y="238" font-size="19" text-anchor="middle" font-weight="bold">tx</text><text x="743" y="238" font-size="19" text-anchor="middle" font-weight="bold">ty</text><text x="801" y="238" font-si