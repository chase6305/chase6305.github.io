<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc"><title id="title">Finite contact sampling can miss penetration</title><desc id="desc">An exact circle penetrates the plane by one millimeter. Eight uniformly spaced samples at the worst phase all miss its lowest point and return a positive minimum of 2.0448 millimeters. A 32-point sample returns a negative minimum.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}</style><rect width="1120" height="650" fill="white"/><text x="30" y="43" font-size="28" text-anchor="start" font-weight="bold">Sparse tool samples can miss geometric penetration</text><text x="30" y="80" font-size="20" text-anchor="start" font-weight="normal">Constructed 2D circle: radius 40 mm, center height 39 mm; exact plane SDF = y.</text><rect x="45" y="112" width="555" height="440" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="322" y="137" font-size="21" text-anchor="middle" font-weight="bold">Zoom near the lowest point</text><rect x="85" y="370.0" width="480" height="75.0" fill="#fff1f2"/><path d="M85.0000,153.0000 L85.0000,445.0000" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray=""/><text x="85.0" y="478" font-size="17" text-anchor="middle" font-weight="normal">-20</text><path d="M205.0000,153.0000 L205.0000,445.0000" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray=""/><text x="205.0" y="478" font-size="17" text-anchor="middle" font-weight="normal">-10</text><path d="M325.0000,153.0000 L325.0000,445.0000" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray=""/><text x="325.0" y="478" font-size="17" text-anchor="middle" font-weight="normal">0</text><path d="M445.0000,153.0000 L445.0000,445.0000" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray=""/><text x="445.0" y="478" font-size="17" text-anchor="middle" font-weight="normal">10</text><path d="M565.0000,153.0000 L565.0000,445.0000" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray=""/><text x="565.0" y="478" font-size="17" text-anchor="middle" font-weight="normal">20</text><text x="72" y="451.0" font-size="17" text-anchor="end" font-weight="normal">-2</text><text x="72" y="376.0" font-size="17" text-anchor="end" font-weight="normal">0</text><text x="72" y="301.0" font-size="17" text-anchor="end" font-weight="normal">2</text><text x="72" y="226.0" font-size="17" text-anchor="end" font-weight="normal">4</text><text x="72" y="151.0" font-size="17" text-anchor="end" font-weight="normal">6</text><path d="M85.0000,206.5381 L89.8000,215.0836 L94.6000,223.4027 L99.4000,231.4996 L104.2000,239.3784 L109.0000,247.0428 L113.8000,254.4967 L118.6000,261.7433 L123.4000,268.7862 L128.2000,275.6283 L133.0000,282.2727 L137.8000,288.7223 L142.6000,294.9797 L147.4000,301.0476 L152.2000,306.9285 L157.0000,312.6245 L161.8000,318.1382 L166.6000,323.4714 L171.4000,328.6263 L176.2000,333.6048 L181.0000,338.4088 L185.8000,343.0400 L190.6000,347.5000 L195.4000,351.7905 L200.2000,355.9129 L205.0000,359.8688 L209.8000,363.6593 L214.6000,367.2859 L219.4000,370.7498 L224.2000,374.0521 L229.0000,377.1938 L233.8000,380.1761 L238.6000,382.9999 L243.4000,385.6661 L248.2000,388.1755 L253.0000,390.5290 L257.8000,392.7273 L262.6000,394.7710 L267.4000,396.6608 L272.2000,398.3974 L277.0000,399.9812 L281.8000,401.4126 L286.6000,402.6923 L291.4000,403.8205 L296.2000,404.7976 L301.0000,405.6238 L305.8000,406.2995 L310.6000,406.8248 L315.4000,407.2000 L320.2000,407.4250 L325.0000,407.5000 L329.8000,407.4250 L334.6000,407.2000 L339.4000,406.8248 L344.2000,406.2995 L349.0000,405.6238 L353.8000,404.7976 L358.6000,403.8205 L363.4000,402.6923 L368.2000,401.4126 L373.0000,399.9812 L377.8000,398.3974 L382.6000,396.6608 L387.4000,394.7710 L392.2000,392.7273 L397.0000,390.5290 L401.8000,388.1755 L406.6000,385.6661 L411.4000,382.9999 L416.2000,380.1761 L421.0000,377.1938 L425.8000,374.0521 L430.6000,370.7498 L435.4000,367.2859 L440.2000,363.659