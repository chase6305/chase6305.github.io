<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc"><title id="title">Payload and static gravity torque</title><desc id="desc">At a prescribed horizontal rest pose, a two kilogram payload needs 11.2815 newton meters, above the constructed five newton meter limit. Retiming cannot change the required static gravity torque.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}</style><rect width="1120" height="570" fill="white"/><text x="30" y="42" font-size="26" text-anchor="start" font-weight="bold">Slower motion cannot repair an infeasible required rest pose</text><text x="30" y="78" font-size="19" text-anchor="start" font-weight="normal">Single pendulum at q = pi/2; qdot = qddot = 0; payload lever arm 0.5 m.</text><path d="M100,145 V415 H990" fill="none" stroke="#334155" stroke-width="2"/><path d="M100,415.0 H990" stroke="#cbd5e1" stroke-dasharray="3 5"/><text x="88" y="421.0" font-size="17" text-anchor="end" font-weight="normal">0</text><path d="M100,302.5 H990" stroke="#cbd5e1" stroke-dasharray="3 5"/><text x="88" y="308.5" font-size="17" text-anchor="end" font-weight="normal">5</text><path d="M100,190.0 H990" stroke="#cbd5e1" stroke-dasharray="3 5"/><text x="88" y="196.0" font-size="17" text-anchor="end" font-weight="normal">10</text><text x="100.0" y="443" font-size="17" text-anchor="middle" font-weight="normal">0</text><text x="322.5" y="443" font-size="17" text-anchor="middle" font-weight="normal">0.5</text><text x="545.0" y="443" font-size="17" text-anchor="middle" font-weight="normal">1</text><text x="767.5" y="443" font-size="17" text-anchor="middle" font-weight="normal">1.5</text><text x="990.0" y="443" font-size="17" text-anchor="middle" font-weight="normal">2</text><text x="100" y="127" font-size="19" text-anchor="start" font-weight="normal">Required gravity torque (N m)</text><text x="545.0" y="476" font-size="18" text-anchor="middle" font-weight="normal">Payl