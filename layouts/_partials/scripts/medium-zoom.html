{{- /* Keep Hextra's image-zoom hook; the viewer is repository-owned. */ -}}
{{- $viewer := resources.Get "js/image-viewer.js" -}}
{{- if hugo.IsProduction -}}
  {{- $viewer = $viewer | minify | fingerprint -}}
{{- end -}}
<script defer src="{{ $viewer.RelPermalink }}" integrity="{{ $viewer.Data.Integrity }}"></script>
