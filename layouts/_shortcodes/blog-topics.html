<div class="blog-topic-index" lang="zh-CN">
  <nav class="blog-topic-index__jump" aria-label="跳转到专题">
    {{ range hugo.Data.blog_topics }}<a href="#{{ .id }}">{{ .title }}</a>{{ end }}
  </nav>
  {{- range hugo.Data.blog_topics -}}
    <section id="{{ .id }}">
      <h2>{{ .title }}</h2>
      <p>{{ .description }}</p>
      <ol>
        {{- range .posts -}}
          {{- with site.GetPage . -}}
            <li><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ if .Draft }} <small>草稿预览</small>{{ end }}</li>
          {{- end -}}
        {{- end -}}
      </ol>
    </section>
  {{- end -}}
</div>
