baseURL: "https://chase6305.github.io/"
title: Chase
theme: hextra
cacheDir: /tmp/hugo_cache/chase-hextra

locale: "en-US"
defaultContentLanguage: en
hasCJKLanguage: true
enableRobotsTXT: true
enableInlineShortcodes: true

pagination:
  pagerSize: 10

languages:
  en:
    label: English
    weight: 1
    title: Chase
    menus:
      main:
        - {identifier: projects, name: Projects, url: "/#open-source", weight: 1}
        - {identifier: blog, name: Blog, url: "/posts/", weight: 2}
        - {identifier: categories, name: Categories, url: "/categories/", weight: 3}
        - {identifier: archives, name: Archives, url: "/archives/", weight: 4}
        - {name: Appearance, weight: 5, params: {type: theme-toggle}}
        - {name: Language, weight: 6, params: {type: language-switch}}
        - {name: Search, weight: 7, params: {type: search}}
        - {name: GitHub, url: "https://github.com/chase6305/", weight: 8, params: {icon: github}}
  zh-cn:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: Chase
    params:
      description: "机器人、具身智能、VLA 与工程实践"
    menus:
      main:
        - {identifier: projects, name: 开源项目, url: "/zh-cn/#open-source", weight: 1}
        - {identifier: blog, name: 博客, url: "/posts/", weight: 2}
        - {identifier: categories, name: 分类, url: "/categories/", weight: 3}
        - {identifier: archives, name: 归档, url: "/archives/", weight: 4}
        - {name: 外观, weight: 5, params: {type: theme-toggle}}
        - {name: 语言, weight: 6, params: {type: language-switch}}
        - {name: 搜索, weight: 7, params: {type: search}}
        - {name: GitHub, url: "https://github.com/chase6305/", weight: 8, params: {icon: github}}

outputs:
  home: [html]
  page: [html]
  section: [html, rss]

taxonomies:
  category: categories
  series: series
  tag: tags

minify:
  disableXML: true
  minifyOutput: true

params:
  description: "Robotics Engineer focused on Embodied AI, VLA, motion planning, robot control, and open-source robotics."
  externalLinkDecoration: true
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: cjt.jpg
      width: 32
      height: 32
      link: /
    width: wide

  theme:
    default: system
    displayToggle: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
    width: wide

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  editURL:
    enable: true
    base: "https://github.com/chase6305/chase6305.github.io/edit/main/content"

  blog:
    list:
      displayTags: true
      sortBy: date
      sortOrder: desc
      pagerSize: 10
    article:
      displayPagination: true

  archives:
    section: posts
    dateFormat: "Jan 02"

  toc:
    displayTags: true

  highlight:
    copy:
      enable: true
      display: hover

  page:
    width: normal
    contextMenu:
      enable: false

  imageZoom:
    enable: true

markup:
  goldmark:
    parser:
      attribute:
        block: true
      autoHeadingID: true
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)'], ['$', '$']]
        enable: true
  highlight:
    codeFences: true
    guessSyntax: false
    lineNos: false
    noClasses: false
    tabWidth: 4
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false
