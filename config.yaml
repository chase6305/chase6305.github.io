baseURL: "https://chase6305.github.io/"
title: Chase
theme: hextra
cacheDir: /tmp/hugo_cache/chase-hextra

locale: "en-US"
defaultContentLanguage: en
hasCJKLanguage: true
enableRobotsTXT: true
enableInlineShortcodes: true

pagination:
  pagerSize: 10

languages:
  en:
    label: English
    weight: 1
    title: Chase

outputs:
  home: [html]
  page: [html]
  section: [html, rss]

taxonomies:
  category: categories
  series: series
  tag: tags

minify:
  disableXML: true
  minifyOutput: true

params:
  description: "Robotics Engineer focused on Embodied AI, VLA, motion planning, robot control, and open-source robotics."
  externalLinkDecoration: true
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: cjt.jpg
      width: 32
      height: 32
      link: /
    width: wide

  theme:
    default: system
    displayToggle: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
    width: wide

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  editURL:
    enable: true
    base: "https://github.com/chase6305/chase6305.github.io/edit/main/content"

  blog:
    list:
      displayTags: true
      sortBy: date
      sortOrder: desc
      pagerSize: 10
    article:
      displayPagination: true

  archives:
    section: posts
    dateFormat: "Jan 02"

  toc:
    displayTags: true

  highlight:
    copy:
      enable: true
      display: hover

  page:
    width: normal
    contextMenu:
      enable: false

  imageZoom:
    enable: true

menu:
  main:
    - identifier: projects
      name: Projects
      url: /#open-source
      weight: 1
    - identifier: blog
      name: Blog
      pageRef: /posts
      weight: 2
    - identifier: categories
      name: Categories
      pageRef: /categories
      weight: 3
    - identifier: archives
      name: Archives
      pageRef: /archives
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search
    - name: GitHub
      weight: 6
      url: "https://github.com/chase6305/"
      params:
        icon: github

markup:
  goldmark:
    parser:
      attribute:
        block: true
      autoHeadingID: true
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)'], ['$', '$']]
        enable: true
  highlight:
    codeFences: true
    guessSyntax: false
    lineNos: false
    noClasses: false
    tabWidth: 4
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false
