<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc">
<title id="title">Two routes for task adaptation</title><desc id="desc">Context adaptation sends demonstrations and live observations to a frozen policy. Parameter adaptation uses demonstration loss and an optimizer to update policy weights. This is a conceptual illustration, not GEN-1.5 architecture.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="510" rx="18" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#0f172a">
<text x="540" y="44" font-size="26" font-weight="bold">Task information: context or weights?</text>
<text x="540" y="76" font-size="16" fill="#475569">Conceptual interfaces — not the GEN-1.5 network architecture</text>
<rect x="36" y="110" width="1008" height="170" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="540" y="144" font-size="20" font-weight="bold">Context adaptation · fixed parameters</text>
<rect x="70" y="176" width="240" height="70" rx="10" fill="white" stroke="#2563eb"/>
<text x="190" y="203" font-size="19">Demonstration</text><text x="190" y="230" font-size="18">+ live history</text>
<rect x="420" y="176" width="240" height="70" rx="10" fill="white" stroke="#2563eb"/>
<text x="540" y="217" font-size="21">Frozen policy</text>
<rect x="770" y="176" width="240" height="70" rx="10" fill="white" stroke="#2563eb"/>
<text x="890" y="217" font-size="21">Action output</text>
<rect x="36" y="300" width="1008" height="170" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
<text x="540" y="334" font-size="20" font-weight="bold">Parameter adaptation · updated weights</text>
<rect x="70" y="366" width="240" height="70" rx="10" fill="white" stroke="#ea580c"/>
<text x="190" y="407" font-size="21">Demonstration data</text>
<rect x="420" y="366" width="240" height="70" rx="10" fill="white" stroke="#ea580c"/>
<text x="540" y="393" font-size="19">Imitation loss</text><text x="540" y="420" font-size="18">+ optimizer</text>
<rect x="770" y="366" width="240" height="70" rx="10" fill="white" stroke="#ea580c"/>
<text x="890" y="407" font-size="21">Adapted policy</text>
</g>
<g fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"><path d="M310 211 H408"/><path d="M660 211 H758"/><path d="M310 401 H408"/><path d="M660 401 H758"/></g>
</svg>
