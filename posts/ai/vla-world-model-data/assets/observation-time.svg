<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">观测采集、到达与决策时刻</title><desc id="desc">决策时只能使用已经到达的观测；训练时预测的未来动作可以作为目标。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#245b9e"/></marker></defs><rect width="1100" height="650" rx="22" fill="#fffef9"/><g font-family="system-ui, Noto Sans CJK SC, sans-serif" fill="#17243c"><text x="35" y="48" font-size="29" font-weight="700">未来观测不能偷看；未来动作可以是训练目标</text><text x="229.0" y="99" font-size="18" font-weight="400">0.980</text><path d="M250.0,115 V570" stroke="#dce4ed" stroke-width="1"/><text x="359.0" y="99" font-size="18" font-weight="400">1.000</text><path d="M380.0,115 V570" stroke="#dce4ed" stroke-width="1"/><text x="489.0" y="99" font-size="18" font-weight="400">1.020</text><path d="M510.0,115 V570" stroke="#dce4ed" stroke-width="1"/><text x="619.0" y="99" font-size="18" font-weight="400">1.040</text><path d="M640.0,115 V570" stroke="#dce4ed" stroke-width="1"/><text x="749.0" y="99" font-size="18" font-weight="400">1.060</text><path d="M770.0,115 V570" stroke="#dce4ed" stroke-width="1"/><text x="879.0" y="99" font-size="18" font-weight="400">1.080</text><path d="M900.0,115 V570" stroke="#dce4ed" stroke-width="1"/><text x="1009.0" y="99" font-size="18" font-weight="400">1.100</text><path d="M1030.0,115 V570" stroke="#dce4ed" stroke-width="1"/><text x="35" y="99" font-size="21" font-weight="700">公共时钟 / 秒</text><text x="35" y="189" font-size="24" font-weight="700">图像 A</text><text x="35" y="221" font-size="21" font-weight="400">可以使用</text><path d="M380.0,195 L510.0,195" fill="none" stroke="#245b9e" stroke-width="3" marker-end="url(#arrow)"/><circle cx="380.0" cy="195" r="8" fill="#2d8044"/><circle cx="510.0" cy="195" r="8" fill="#2d8044"/><text x="340.0" y="164" font-size="20" font-weight="400">采集</text><text x="490.0" y="242" font-size="20" font-weight="400">到达</text><text x="35" y="324" font-size="24" font-weight="700">图像 B</text><text x="35" y="356" font-size="21" font-weight="400">尚未到达</text><path d="M542.5,330 L900.0,330" fill="none" stroke="#245b9e" stroke-width="3" marker-end="url(#arrow)"/><circle cx="542.5" cy="330" r="8" fill="#ce7b18"/><circle cx="900.0" cy="330" r="8" fill="#ce7b18"/><text x="517.5" y="301" font-size="20" font-weight="400">采集</text><text x="880.0" y="376" font-size="20" font-weight="400">到达</text><path d="M640.0,118 V570" stroke="#17243c" stroke-width="3" stroke-dasharray="9 7"/><text x="571.0" y="417" font-size="20" font-weight="700">决策 t = 1.040</text><text x="35" y="473" font-size="24" font-weight="700">训练动作块</text><text x="35" y="509" font-size="21" font-weight="400">未来目标</text><rect x="640.0" y="447" width="126" height="82" rx="8" fill="#eee8f8" stroke="#b8abd6"/><text x="662.0" y="482" font-size="22" font-weight="700">a[0]</text><text x="656.0" y="513" font-size="18" font-weight="400">1.040</text><rect x="770.0" y="447" width="126" height="82" rx="8" fill="#eee8f8" stroke="#b8abd6"/><text x="792.0" y="482" font-size="22" font-weight="700">a[1]</text><text x="786.0" y="513" font-size="18" font-weight="400">1.060</text><rect x="900.0" y="447" width="126" height="82" rx="8" fill="#eee8f8" stroke="#b8abd6"/><text x="922.0" y="482" font-size="22" font-weight="700">a[2]</text><text x="916.0" y="513" font-size="18" font-weight="400">1.080</text><text x="35" y="608" font-size="23" font-weight="700">A 的观测年龄 = 1.040 − 1.000 = 40 ms；到达后等待时间是另一回事。</text></g></svg>