<text x="42" y="86" font-size="18" text-anchor="start" font-weight="normal">H = 30 future targets   |   one state sample at time 0   |   shared time scale</text>
<line x1="220" y1="133" x2="220" y2="360" stroke="#c8d6e2" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="220" y="399" font-size="18" text-anchor="middle" font-weight="normal">0 s</text>
