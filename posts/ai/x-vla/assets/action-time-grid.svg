<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc">
<title id="title">Same action count, different target times</title>
<desc id="desc">Two sets of thirty future actions span one and four seconds on the same time axis. The state is a separate sample at zero.</desc>
